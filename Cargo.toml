[package]
name = "cargo-crap"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["cargo-crap contributors"]
license = "MIT OR Apache-2.0"
description = "Change Risk Anti-Patterns (CRAP) metric for Rust projects"
repository = "https://github.com/minikin/cargo-crap"
homepage = "https://github.com/minikin/cargo-crap"
documentation = "https://docs.rs/cargo-crap"
readme = "README.md"
exclude = [
    "CLAUDE.md",
    "Justfile",
    "clippy.toml",
    "rustfmt.toml",
    "rust-toolchain.toml",
    "**/.DS_Store",
]
keywords = ["cargo", "coverage", "complexity", "metrics", "crap"]
categories = ["development-tools::cargo-plugins", "development-tools::testing"]

[[bin]]
name = "cargo-crap"
path = "src/main.rs"

[lib]
name = "cargo_crap"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.4", features = ["derive"] }
comfy-table = "7"
globset = "0.4"
ignore = "0.4"
rayon = "1"
indicatif = "0.18.4"
lcov = "0.8"
owo-colors = "4"
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
thiserror = "2"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
codegen-units = 1
