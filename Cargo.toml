[package]
name = "cargo-crap"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["cargo-crap contributors"]
license = "MIT OR Apache-2.0"
description = "Change Risk Anti-Patterns (CRAP) metric for Rust projects"
repository = "https://github.com/example/cargo-crap"
readme = "README.md"
keywords = ["cargo", "coverage", "complexity", "metrics", "crap"]
categories = ["development-tools::cargo-plugins", "development-tools::testing"]

[[bin]]
name = "cargo-crap"
path = "src/main.rs"

[lib]
name = "cargo_crap"
path = "src/lib.rs"

[dependencies]
# Static analysis: cyclomatic complexity + function spans via tree-sitter.
rust-code-analysis = "0.0.25"

# Coverage input (LCOV format is what `cargo llvm-cov` and `cargo tarpaulin` emit).
lcov = "0.8"

# CLI.
clap = { version = "4.4", features = ["derive"] }

# Error handling.
anyhow = "1"
thiserror = "1"

# Serialization for JSON output.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Respect .gitignore / target/ when walking the source tree.
ignore = "0.4"

# Human-readable table output.
comfy-table = "7"
owo-colors = "4"

[dev-dependencies]
# Deterministic fixture-based integration tests.
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
